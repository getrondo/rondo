services:
    postgres:
        image: postgres:17-alpine
        container_name: rondo-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: rondo
            POSTGRES_PASSWORD: rondo
            POSTGRES_DB: rondo
        ports:
            - '54329:5432'
        volumes:
            - rondo-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U rondo -d rondo']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    rondo-pgdata:
