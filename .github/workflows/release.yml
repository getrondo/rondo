name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Release PR
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
